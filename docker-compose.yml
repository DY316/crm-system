services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: ${SERVER_PORT:-3000}
      SERVER_CORS_ORIGINS: ${SERVER_CORS_ORIGINS:-http://localhost:5173}
    ports:
      - "${SERVER_PORT:-3000}:${SERVER_PORT:-3000}"
